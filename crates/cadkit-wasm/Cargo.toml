[package]
name = "cadkit-wasm"
description = "WebAssembly bindings and browser viewer for cadkit."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
# Published to npm as `cadkit-wasm` (build.py), not to crates.io.
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cadkit.workspace = true
serde_json.workspace = true
wasm-bindgen = "0.2"
js-sys = "0.3"

# FFI crate: binding macros/ABI need `unsafe`, so workspace lints are restated without the unsafe ban.
[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
