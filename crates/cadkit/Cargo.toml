[package]
name = "cadkit"
description = "CAD file I/O and document operations for cadkit: read DWG/DGN/DXF/CityGML; write DXF, seed-based DGN V8 and CityGML."
version.workspace = true
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["dwg", "dgn", "dxf", "gml", "svg", "json"]
dwg = ["dep:cadkit-dwg"]
dgn = ["dgn-read", "cadkit-dgn/write"]
dgn-read = ["dep:cadkit-dgn"]
dxf = ["dep:cadkit-dxf"]
gml = ["dep:cadkit-gml"]
svg = []
json = ["dep:serde_json"]

[dependencies]
cadkit-core.workspace = true
cadkit-dgn = { workspace = true, optional = true, default-features = false }
cadkit-dwg = { workspace = true, optional = true }
cadkit-dxf = { workspace = true, optional = true }
cadkit-gml = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[lints]
workspace = true

[[example]]
name = "interchange"
required-features = ["dgn", "gml"]
