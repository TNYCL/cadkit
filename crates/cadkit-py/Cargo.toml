[package]
name = "cadkit-py"
description = "Python bindings for cadkit."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
# Published to PyPI as `pycadkit` (maturin), not to crates.io.
publish = false

[lib]
name = "_cadkit"
crate-type = ["cdylib"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
cadkit.workspace = true
pyo3 = { version = "0.29.3", features = ["extension-module", "abi3-py39"] }

# FFI crate: binding macros/ABI need `unsafe`, so workspace lints are restated without the unsafe ban.
[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
