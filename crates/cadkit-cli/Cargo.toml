[package]
name = "cadkit-cli"
description = "Command-line tool to inspect and convert DWG, DGN, DXF and CityGML files."
version.workspace = true
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "cadkit"
path = "src/main.rs"
# The `cadkit` library crate owns the documentation name.
doc = false

[dependencies]
cadkit.workspace = true
serde_json.workspace = true
clap = { version = "4", features = ["derive"] }

[lints]
workspace = true

# `cargo binstall cadkit-cli` downloads the release archive instead of compiling.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/cadkit-{ target }.tar.gz"
bin-dir = "cadkit-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/cadkit-{ target }.zip"
pkg-fmt = "zip"
