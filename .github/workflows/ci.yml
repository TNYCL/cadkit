name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "4"

permissions:
  contents: read

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore public corpus
        id: corpus
        uses: actions/cache@v4
        with:
          path: corpus/public
          key: corpus-public-${{ hashFiles('scripts/fetch-corpus.py') }}
      - name: Fetch public corpus
        if: steps.corpus.outputs.cache-hit != 'true'
        run: python scripts/fetch-corpus.py
      # cadkit-py and cadkit-wasm need their own toolchains; they have dedicated jobs below.
      - run: cargo test --locked
      - run: cargo test --locked --doc
      # The committed document JSON Schema must match the model.
      - run: cargo test --locked -p cadkit-core --features schemars --test schema

  citygml-schema:
    name: CityGML official XSD validation
    runs-on: ubuntu-latest
    env:
      CADKIT_REQUIRE_GML_XSD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install independent XML validator
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - name: Restore official schema cache
        uses: actions/cache@v4
        with:
          path: corpus/public/citygml-schemas
          key: citygml-schemas-${{ hashFiles('scripts/validate-citygml.py') }}
      - name: Fetch official schemas and build the local catalog
        run: python scripts/validate-citygml.py --fetch
      - name: Validate native and generated CityGML against official schemas
        run: python scripts/buildlock.py cargo test --locked -p cadkit-gml

  msrv:
    name: MSRV 1.88
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --all-targets

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  semver:
    name: semver checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 0.5.x only adds: a breaking change fails here unless the minor version is raised.
      # Bindings are not Rust libraries on crates.io; cadkit-scene and cadkit-gpu join the
      # check once 0.5.0 has published a baseline for them.
      - uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          exclude: cadkit-py,cadkit-wasm,cadkit-capi,cadkit-cli,cadkit-scene,cadkit-gpu

  gpu:
    name: GPU render (lavapipe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Mesa lavapipe (software Vulkan)
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      # Software rasterization: evidence that the pipelines validate and draw where expected,
      # not a substitute for checks on real GPUs.
      - run: cargo test --locked -p cadkit-gpu
        env:
          CADKIT_GPU_TESTS: "1"

  wasm:
    name: wasm32 build + node test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install wasm-bindgen CLI matching Cargo.lock
        run: |
          version=$(awk '/^name = "wasm-bindgen"$/{getline; gsub(/[^0-9.]/, "", $0); print; exit}' Cargo.lock)
          echo "wasm-bindgen $version"
          cargo install wasm-bindgen-cli --version "$version" --locked
      # The scene crate stays GPU-free and WASM-compatible.
      - run: cargo check --locked -p cadkit-scene --target wasm32-unknown-unknown
      - name: Build (crates/cadkit-wasm/build.py calls the build lock itself)
        run: python crates/cadkit-wasm/build.py
      - run: node --test crates/cadkit-wasm/tests/node_test.mjs

  python:
    name: python wheel + pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --locked --out dist
          working-directory: crates/cadkit-py
          manylinux: auto
      - name: Install wheel and run pytest
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install --no-index --find-links crates/cadkit-py/dist pycadkit
          python -m pytest crates/cadkit-py/tests -q

  capi:
    name: C API build + examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore public corpus
        id: corpus
        uses: actions/cache@v4
        with:
          path: corpus/public
          key: corpus-public-${{ hashFiles('scripts/fetch-corpus.py') }}
      - name: Fetch public corpus
        if: steps.corpus.outputs.cache-hit != 'true'
        run: python scripts/fetch-corpus.py
      - run: cargo build -p cadkit-capi --release --locked
      - name: Compile C and C++ examples with CMake
        run: |
          cmake -S crates/cadkit-capi -B build/capi -DCADKIT_LIB_DIR="$PWD/target/release" -DCMAKE_BUILD_TYPE=Release
          cmake --build build/capi
          ctest --test-dir build/capi --output-on-failure
      - name: Compile with plain gcc/g++ and run
        run: |
          gcc -std=c11 -fsyntax-only -Icrates/cadkit-capi/include crates/cadkit-capi/tests/abi.c
          g++ -std=c++17 -fsyntax-only -x c++ -Icrates/cadkit-capi/include crates/cadkit-capi/tests/abi.c
          mkdir -p build
          gcc -Wall -Wextra -Werror -std=c99 -Icrates/cadkit-capi/include crates/cadkit-capi/examples/c/info.c \
            -Ltarget/release -lcadkit_capi -Wl,-rpath,"$PWD/target/release" -o build/info_c
          g++ -Wall -Wextra -Werror -std=c++17 -Icrates/cadkit-capi/include crates/cadkit-capi/examples/cpp/info.cpp \
            -Ltarget/release -lcadkit_capi -Wl,-rpath,"$PWD/target/release" -o build/info_cpp
          for f in corpus/public/acadsharp/sample_AC1015_ascii.dxf; do
            ./build/info_c "$f"
            ./build/info_cpp "$f"
          done

  # One job per target, so all targets fuzz at the same time (about 3 minutes instead of 10+).
  fuzz-smoke:
    name: fuzz ${{ matrix.target }} (60 s)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [read_any, dgn, dgn_write, gml, dwg, dxf, dxf_roundtrip, svg]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore public corpus
        id: corpus
        uses: actions/cache@v4
        with:
          path: corpus/public
          key: corpus-public-${{ hashFiles('scripts/fetch-corpus.py') }}
      - name: Fetch public corpus
        if: steps.corpus.outputs.cache-hit != 'true'
        run: python scripts/fetch-corpus.py
      - run: python scripts/seed-fuzz-corpus.py
      - run: cargo install cargo-fuzz --locked
      - name: Fuzz ${{ matrix.target }} for 60 seconds
        run: python scripts/buildlock.py cargo +nightly fuzz run "${{ matrix.target }}" -- -max_total_time=60 -rss_limit_mb=2048
      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts

  # The one-line installers, run for real against the published release: first from
  # release.cadkit.org, then with the mirror unreachable so the GitHub Releases path runs too.
  installer:
    name: installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        if: matrix.os == 'ubuntu-latest'
        run: shellcheck site/public/install.sh
      - name: install.sh, piped as documented
        if: runner.os != 'Windows'
        run: |
          CADKIT_INSTALL_DIR="$RUNNER_TEMP/mirror" sh < site/public/install.sh
          "$RUNNER_TEMP/mirror/cadkit" --version
      - name: install.sh, GitHub Releases fallback
        if: runner.os != 'Windows'
        run: |
          CADKIT_DOWNLOAD_URL=https://release.invalid CADKIT_INSTALL_DIR="$RUNNER_TEMP/fallback" sh site/public/install.sh
          "$RUNNER_TEMP/fallback/cadkit" --version
      - name: install.ps1 through iex (PowerShell 7), user PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'mirror'
          $env:CADKIT_INSTALL_DIR = $dir
          Get-Content -Raw site/public/install.ps1 | Invoke-Expression
          cadkit --version
          if ($LASTEXITCODE -ne 0) { throw 'cadkit is not on PATH for this session' }
          $stored = [Environment]::GetEnvironmentVariable('Path', 'User') -split ';'
          if ($stored -notcontains $dir) { throw 'the install directory was not added to the user PATH' }
      - name: install.ps1 (Windows PowerShell 5.1), GitHub Releases fallback
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:CADKIT_DOWNLOAD_URL = 'https://release.invalid'
          $env:CADKIT_NO_MODIFY_PATH = '1'
          $env:CADKIT_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'fallback'
          ./site/public/install.ps1
          & (Join-Path $env:CADKIT_INSTALL_DIR 'cadkit.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'cadkit.exe did not run' }

  site:
    name: website (cadkit.org)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      # Prebuild steps sync docs/ and CHANGELOG.md, render the hero with cadkit-wasm, fetch pinned
      # public samples (sha256-checked) and the public stats summary.
      - run: npm run check
      - run: npm test
      - run: npm run build
      # Links, meta tags, sitemap, security.txt, CSP hashes, forbidden strings, secret patterns.
      - run: npm run verify
