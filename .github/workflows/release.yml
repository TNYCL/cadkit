name: Release

# Manual or tag-triggered. Nothing here runs until a tag `v*` is pushed or the workflow is
# dispatched by hand. Required secrets: CARGO_REGISTRY_TOKEN, PYPI_API_TOKEN, NPM_TOKEN.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Actually publish (false = build and verify only)"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish }}

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - name: Publishing requires a version tag equal to the workspace version
        if: env.PUBLISH == 'true'
        run: |
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "publishing is only allowed from a v* tag (ref is ${GITHUB_REF}); dispatch the workflow on a tag"
            exit 1
          fi
          version=$(cargo metadata --no-deps --format-version 1 | python3 -c "import sys,json; print(next(p['version'] for p in json.load(sys.stdin)['packages'] if p['name']=='cadkit'))")
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != cadkit $version"; exit 1; }

  crates-io:
    name: crates.io
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          # core -> format crates -> facade -> cli / capi. The sleep lets the index catch up.
          if [ "$PUBLISH" != "true" ]; then
            # Dependent crates cannot be verified before their dependencies are on the index.
            cargo publish -p cadkit-core --locked --dry-run
            exit 0
          fi
          for crate in cadkit-core cadkit-dxf cadkit-dgn cadkit-dwg cadkit cadkit-cli cadkit-capi; do
            echo "::group::publish $crate"
            cargo publish -p "$crate" --locked
            echo "::endgroup::"
            sleep 45
          done

  pypi-wheels:
    name: wheels (${{ matrix.os }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --locked --out dist
          working-directory: crates/cadkit-py
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: crates/cadkit-py/dist/*.whl

  pypi-sdist:
    name: sdist
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
          working-directory: crates/cadkit-py
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: crates/cadkit-py/dist/*.tar.gz

  pypi-publish:
    name: PyPI publish
    needs: [pypi-wheels, pypi-sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - name: Publish
        if: env.PUBLISH == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist

  npm:
    name: npm (wasm)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          version=$(awk '/^name = "wasm-bindgen"$/{getline; gsub(/[^0-9.]/, "", $0); print; exit}' Cargo.lock)
          cargo install wasm-bindgen-cli --version "$version" --locked
          python crates/cadkit-wasm/build.py
      - name: Pack (package.json is generated by build.py)
        working-directory: crates/cadkit-wasm/pkg
        run: |
          test -f package.json
          npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: crates/cadkit-wasm/pkg/*.tgz
      - name: Publish
        if: env.PUBLISH == 'true'
        working-directory: crates/cadkit-wasm/pkg
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

  cli-binaries:
    name: CLI (${{ matrix.target }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, ext: "" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, ext: ".exe" }
          - { os: macos-latest, target: aarch64-apple-darwin, ext: "" }
          # Intel macOS is cross-compiled on the Apple Silicon runner (macos-13 is retired).
          - { os: macos-latest, target: x86_64-apple-darwin, ext: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p cadkit-cli --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="cadkit-${{ matrix.target }}"
          mkdir -p "$name"
          cp "target/${{ matrix.target }}/release/cadkit${{ matrix.ext }}" "$name/"
          cp LICENSE-MIT LICENSE-APACHE README.md "$name/"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a "$name.zip" "$name"
          else
            tar czf "$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: |
            cadkit-*.zip
            cadkit-*.tar.gz

  github-release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [crates-io, pypi-publish, npm, cli-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
